name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          if ! npm run lint; then
            echo "::error::Lint gate failed. Run 'npm run lint' in backend/ and fix the reported issues before pushing."
            exit 1
          fi

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: |
          if ! npx tsc --noEmit; then
            echo "::error::Type-check gate failed. Run 'npx tsc --noEmit' in backend/ and resolve the type errors before pushing."
            exit 1
          fi

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: |
          if ! npm run test:coverage; then
            echo "::error::Test gate failed. Run 'npm run test:coverage' in backend/ and fix the failing tests before pushing."
            exit 1
          fi

      - name: Enforce 70% coverage threshold
        run: |
          node -e "
          const fs = require('fs');
          const path = 'coverage/coverage-summary.json';
          if (!fs.existsSync(path)) {
            console.error('::error::Coverage summary not found at ' + path + '. Ensure test:coverage emits a json-summary report.');
            process.exit(1);
          }
          const summary = JSON.parse(fs.readFileSync(path, 'utf8')).total;
          const metrics = ['lines', 'statements', 'functions', 'branches'];
          const threshold = 70;
          let failed = false;
          for (const metric of metrics) {
            const pct = summary[metric].pct;
            console.log(metric + ': ' + pct + '%');
            if (pct < threshold) {
              console.error('::error::Coverage gate failed: ' + metric + ' coverage ' + pct + '% is below the required ' + threshold + '%.');
              failed = true;
            }
          }
          if (failed) process.exit(1);
          console.log('Coverage gate passed (>= ' + threshold + '%).');
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          if ! npm run build; then
            echo "::error::Build gate failed. Run 'npm run build' in backend/ and fix the compilation errors before pushing."
            exit 1
          fi
